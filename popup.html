<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Add a site · goTab</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shared.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body class="popup">
  <main>
    <header class="brand"><img src="icons/icon48.png" width="32" height="32" alt=""><span>goTab</span></header>
    <h1>Your next shortcut.</h1>
    <p class="subtitle">Save a site. Get there with a word.</p>
    <p id="vaultHint" class="hint" role="status">Checking encrypted sync…</p>
    <form id="addForm">
      <fieldset id="addFields" disabled><legend class="sr-only">Add a site</legend>
      <label for="keyword">Keyword</label>
      <input id="keyword" name="keyword" type="text" placeholder="e.g. github" required maxlength="100" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="keywordHint">
      <p class="hint" id="keywordHint">Use this after <kbd>go</kbd> in the address bar.</p>
      <label for="url">Site URL</label>
      <input id="url" name="url" type="url" placeholder="https://github.com" required autocomplete="off" maxlength="2048" aria-describedby="urlHint">
      <p class="hint" id="urlHint">Use https:// when available. Do not include passwords or access tokens.</p>
      <button class="primary full" id="addBtn" type="submit">Add site</button>
      </fieldset>
    </form>
    <p id="statusMessage" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <footer><a id="manageLink" href="sites.html" target="_blank" rel="noopener">View saved sites <span aria-hidden="true">↗</span></a><span class="hint">Your shortcut library</span></footer>
  </main>
</body>
</html>
